services:
  postgres:
    image: postgres:16-alpine
    container_name: peer-engine-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: peer
      POSTGRES_PASSWORD: peer
      POSTGRES_DB: peer_engine
    volumes:
      - peer_engine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peer -d peer_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  peer_engine_pgdata:
