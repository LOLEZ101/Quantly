<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S&P 500</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="page">
      <div class="search" id="search">
        <label class="search-field" for="search-input">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.25" />
            <path d="M16.5 16.5L21 21" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" />
          </svg>
          <input
            id="search-input"
            class="search-input"
            type="search"
            placeholder="Search S&P 500 stocks"
            autocomplete="off"
            spellcheck="false"
            aria-autocomplete="list"
            aria-controls="search-results"
            aria-expanded="false"
          />
        </label>
        <ul class="search-results" id="search-results" role="listbox" hidden></ul>
      </div>

      <header class="hero">
        <h1 class="brand" id="brand">S&P 500</h1>
        <div class="price-row">
          <p class="price" id="price">—</p>
          <p class="change" id="change">—</p>
        </div>
        <p class="status" id="status" aria-live="polite"></p>
      </header>

      <nav class="ranges" aria-label="Time range">
        <button type="button" class="range-btn" data-range="1d">1D</button>
        <button type="button" class="range-btn" data-range="5d">5D</button>
        <button type="button" class="range-btn" data-range="1mo">1M</button>
        <button type="button" class="range-btn" data-range="6mo">6M</button>
        <button type="button" class="range-btn" data-range="ytd">YTD</button>
        <button type="button" class="range-btn is-active" data-range="1y">1Y</button>
        <button type="button" class="range-btn" data-range="5y">5Y</button>
        <button type="button" class="range-btn" data-range="max">Max</button>
      </nav>

      <section class="chart-wrap" aria-label="Price chart">
        <canvas id="chart"></canvas>
      </section>

      <section
        class="peer-value-card"
        id="peer-value-card"
        aria-label="Peer value comparison"
        hidden
      >
        <div class="peer-value-card__metrics" id="peer-value-metrics">
          <p class="peer-value-card__loading" id="peer-value-loading">
            Loading peer stats…
          </p>
        </div>
        <div class="peer-value-card__narrative" id="peer-value-narrative">
          <p class="peer-value-card__sector" id="peer-value-sector"></p>
          <p class="peer-value-card__value" id="peer-value-category"></p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
