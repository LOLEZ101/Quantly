# Soft adjacency edges between taxonomy nodes (typically peer_cluster leaves).
# Adjacency does not merge nodes; it influences peer scoring only.
# Relationships are treated as undirected unless directed: true.

adjacency_version: "1.0.0"
effective_date: "2026-07-31"
taxonomy_version: "1.0.0"

relationships:
  # Telecommunications
  - id: adj_wireless_owners_cable
    source_node_id: national_wireless_network_owners
    target_node_id: cable_broadband_operators
    strength: 0.6
    rationale: Multi-play convergence; consumer connectivity substitutes and bundles.

  - id: adj_wireless_owners_incumbent
    source_node_id: national_wireless_network_owners
    target_node_id: integrated_incumbent_telcos
    strength: 0.7
    rationale: Integrated telcos often have wireless; overlapping consumer connectivity.

  - id: adj_cable_fiber
    source_node_id: cable_broadband_operators
    target_node_id: fiber_network_operators
    strength: 0.8
    rationale: Competing fixed broadband access technologies.

  - id: adj_fiber_incumbent
    source_node_id: fiber_network_operators
    target_node_id: integrated_incumbent_telcos
    strength: 0.7
    rationale: Overlapping fixed access footprints and upgrade paths.

  - id: adj_wireless_owners_mvno
    source_node_id: national_wireless_network_owners
    target_node_id: wireless_mvno_and_resellers
    strength: 0.4
    rationale: Same end market; different infrastructure model (owner vs renter).

  - id: adj_wireless_owners_regional
    source_node_id: national_wireless_network_owners
    target_node_id: regional_wireless_operators
    strength: 0.65
    rationale: Same service category; scale and spectrum differ.

  - id: adj_towers_wireless_owners
    source_node_id: tower_and_macro_site_operators
