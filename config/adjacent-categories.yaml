    rationale: Customer-supplier linkage; not economic peers but relevant adjacency.

  - id: adj_wholesale_fiber_fiber_ops
    source_node_id: wholesale_fiber_and_backhaul
    target_node_id: fiber_network_operators
    strength: 0.5
